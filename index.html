<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1 class="header">The Image Finder</h1>
        <p class="startline">Every image at your fingertips</p>
        <form class="search-box">
            <label for="searchbar" id="searchh"></label>
            <input type="search" class="searchbar">
            <button type="submit" id="searchbutton">Search</button>
        </form>
        <p id="status">0 images found</p>
        <section id="results" aria-label="Image search results">
            <p class="emptymessage">Search for something to get results</p>
        </section>
        <script src="scrpit.js"></script>
    </body>
</html>
